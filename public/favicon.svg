<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pole -->
  <rect x="1" y="1" width="2" height="30" rx="0.5" fill="#999"/>
  <!-- Checkered flag: 4 cols x 4 rows, each cell 7x5 px, starting at x=3 y=1 -->
  <!-- Row 0: B W B W -->
  <rect x="3"  y="1"  width="7" height="5" fill="#111"/>
  <rect x="10" y="1"  width="7" height="5" fill="#fff"/>
  <rect x="17" y="1"  width="7" height="5" fill="#111"/>
  <rect x="24" y="1"  width="7" height="5" fill="#fff"/>
  <!-- Row 1: W B W B -->
  <rect x="3"  y="6"  width="7" height="5" fill="#fff"/>
  <rect x="10" y="6"  width="7" height="5" fill="#111"/>
  <rect x="17" y="6"  width="7" height="5" fill="#fff"/>
  <rect x="24" y="6"  width="7" height="5" fill="#111"/>
  <!-- Row 2: B W B W -->
  <rect x="3"  y="11" width="7" height="5" fill="#111"/>
  <rect x="10" y="11" width="7" height="5" fill="#fff"/>
  <rect x="17" y="11" width="7" height="5" fill="#111"/>
  <rect x="24" y="11" width="7" height="5" fill="#fff"/>
  <!-- Row 3: W B W B -->
  <rect x="3"  y="16" width="7" height="5" fill="#fff"/>
  <rect x="10" y="16" width="7" height="5" fill="#111"/>
  <rect x="17" y="16" width="7" height="5" fill="#fff"/>
  <rect x="24" y="16" width="7" height="5" fill="#111"/>
</svg>
